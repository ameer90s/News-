<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff2ff">
<meta name="color-scheme" content="light dark">
<title>مرصد الإمارات الذكي</title>
<script>window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); });</script>
<script>(function () { var t = 'day'; try { if (JSON.parse(localStorage.getItem('mirsad.theme')) === 'night') t = 'night'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'night' ? '#4a38c0' : '#dff2ff'); })();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/style.css?v=1.2.1">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="18.5" r="2.6"/><path d="M8.3 10.7l7.4-3.9M8.3 13.3l7.4 3.9"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.4 3.4 3.4 14.6 0 18M12 3c-3.4 3.4-3.4 14.6 0 18"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2.5L4.5 14H11l-1 7.5L19.5 10H13z"/></symbol>
    <symbol id="i-bank" viewBox="0 0 24 24"><path d="M3 9.5L12 4l9 5.5M5.5 10v7.5M10 10v7.5M14 10v7.5M18.5 10v7.5M3.5 20h17"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4.5V20h16M8 15.5l3.5-3.8 3 2.6L20 8M15.5 8H20v4.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 2.8v6c0 4.7-3.2 7.9-7.5 9.2-4.3-1.3-7.5-4.5-7.5-9.2v-6z"/><path d="M8.6 12.2l2.5 2.5 4.4-4.9"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.2s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M21 15.5v-1.6l-7.5-4.6V4.5a1.5 1.5 0 0 0-3 0v4.8L3 13.9v1.6l7.5-2.2v4.6L8.8 19.4V21l3.2-.9 3.2.9v-1.6l-1.7-1.5v-4.6z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM18.5 16l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5.5L8.5 12 15 18.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></symbol>
    <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6.3-6.3"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  </defs>
</svg>

<div class="app">
  <header class="hdr glass">
    <div class="hdr-top">
      <h1 id="appTitle">مرصد الإمارات الذكي</h1>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="التبديل إلى الوضع الليلي"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
      <div class="clock" id="clockBox">
        <svg class="flag" viewBox="0 0 60 30" role="img" aria-label="علم الإمارات">
          <defs><clipPath id="flagClip"><rect width="60" height="30" rx="3"/></clipPath></defs>
          <g clip-path="url(#flagClip)">
            <rect width="60" height="30" fill="#ffffff"/>
            <rect x="15" width="45" height="10" fill="#00732f"/>
            <rect x="15" y="20" width="45" height="10" fill="#000000"/>
            <rect width="15" height="30" fill="#ef3340"/>
          </g>
        </svg>
        <time id="clock">--:--</time>
      </div>
    </div>
    <p class="tagline" id="tagline">متابعة ذكية لأهم الأخبار واتجاهاتها وتأثيرها المحتمل على الإمارات.</p>
    <div class="controls">
      <button class="btn btn-refresh" id="refreshBtn" type="button">
        <span class="spin" aria-hidden="true"></span>
        <svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>
        <span id="refreshLabel">تحديث</span>
      </button>
      <button class="btn" id="shareBtn" type="button">
        <svg class="ic" aria-hidden="true"><use href="#i-share"/></svg>
        <span>مشاركة</span>
      </button>
      <div class="last" id="lastUpdate"><i class="dot" aria-hidden="true"></i>آخر تحديث: <span id="lastTime">--</span></div>
    </div>
  </header>

  <nav class="ranges glass" id="ranges" aria-label="مدة الأخبار">
    <button type="button" data-h="6">6 ساعات</button>
    <button type="button" data-h="12">12 ساعة</button>
    <button type="button" data-h="24" class="on">24 ساعة</button>
    <button type="button" data-h="48">48 ساعة</button>
    <button type="button" data-h="72">72 ساعة</button>
  </nav>

  <main>
    <section class="card glass" id="bigPicture" aria-labelledby="bpHead">
      <div class="card-head">
        <span class="hchip"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg></span>
        <h2 id="bpHead">الصورة الكبرى</h2>
        <span class="slot-ai" id="bpAi"></span>
      </div>
      <h3 id="bpTitle" class="bp-title"></h3>
      <p id="bpSummary" class="bp-sum"></p>
      <button type="button" class="foot" id="bpMore"><svg class="ic" aria-hidden="true"><use href="#i-radar"/></svg><span>التحليل الكامل <em id="bpSrc"></em></span><span class="sp"></span><svg class="ic" aria-hidden="true"><use href="#i-left"/></svg></button>
    </section>

    <section class="domains" id="domains" aria-label="مستوى التأثير حسب المجال"></section>

    <section class="card glass" id="latest" aria-labelledby="latestHead">
      <div class="card-head">
        <span class="hchip"><svg class="ic" aria-hidden="true"><use href="#i-bolt"/></svg></span>
        <h2 id="latestHead">آخر الأخبار الهامة</h2>
        <a class="all-link" href="#top" id="allLink"><span>عرض الكل</span><svg class="ic" aria-hidden="true"><use href="#i-left"/></svg></a>
      </div>
      <div class="list" id="latestList"></div>
    </section>

    <section class="card glass" id="analysis" aria-labelledby="anHead">
      <div class="card-head">
        <span class="hchip"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg></span>
        <h2 id="anHead">التحليل المتكامل</h2>
        <span class="slot-ai" id="anAi"></span>
      </div>
      <div class="an-list" id="anList"></div>
    </section>

    <section class="card glass" id="top" aria-labelledby="topHead">
      <div class="card-head">
        <span class="hchip"><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg></span>
        <h2 id="topHead">الأخبار الأعلى أهمية</h2>
      </div>
      <div class="tabs" id="scopeTabs" role="tablist" aria-label="نطاق الأخبار">
        <button type="button" role="tab" data-s="all" class="on" aria-selected="true">الكل</button>
        <button type="button" role="tab" data-s="local" aria-selected="false">محلية</button>
        <button type="button" role="tab" data-s="regional" aria-selected="false">إقليمية</button>
        <button type="button" role="tab" data-s="international" aria-selected="false">دولية</button>
        <button type="button" role="tab" data-s="impact" aria-selected="false">مؤثرة</button>
      </div>
      <div class="list" id="topList"></div>
    </section>
  </main>
</div>

<nav class="tabbar glass" id="tabbar" aria-label="التنقل">
  <button type="button" data-d="all" class="on"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>الرئيسية</span></button>
  <button type="button" data-d="political"><svg class="ic" aria-hidden="true"><use href="#i-bank"/></svg><span>سياسي</span></button>
  <button type="button" data-d="economic"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg><span>اقتصادي</span></button>
  <button type="button" data-d="military"><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg><span>عسكري</span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-in">
    <button type="button" class="sheet-x" id="sheetX" aria-label="إغلاق"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    <div id="sheetBody"></div>
  </div>
</dialog>

<script src="/app.js?v=1.2.1" defer></script>
</body>
</html>
